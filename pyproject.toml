[project]
name = "bluray-to-mp4"
version = "0.2.28"
description = "Local Blu-ray/DVD to MP4 ripper with smart recommendations, NVENC/x265 encode, PGS-to-SRT subtitles, and TV series episode handling"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bluray-to-mp4 = "bluray_to_mp4.cli:main"
bluray-to-mp4-gui = "bluray_to_mp4.ui.app:main"

[project.optional-dependencies]
ui = ["PySide6>=6.6"]
dev = ["pytest>=8", "pyinstaller>=6.5"]

[tool.setuptools.packages.find]
include = ["bluray_to_mp4", "bluray_to_mp4.*"]
exclude = ["tests", "packaging"]

[tool.setuptools.package-data]
"bluray_to_mp4.ui" = ["app_icon.svg"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]