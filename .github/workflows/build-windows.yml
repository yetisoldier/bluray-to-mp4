name: build-windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download ffmpeg (win64, full build with NVENC + all encoders)
        shell: pwsh
        run: |
          $zipUrl = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full.zip"
          $zipPath = "$env:TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath -TimeoutSec 300
          Expand-Archive -Path $zipPath -DestinationPath "$env:TEMP\ffmpeg-extract" -Force
          $binDir = Get-ChildItem "$env:TEMP\ffmpeg-extract" -Recurse -Directory | Where-Object { $_.Name -eq "bin" } | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "packaging\tools" | Out-Null
          Copy-Item "$($binDir.FullName)\ffmpeg.exe" "packaging\tools\ffmpeg.exe"
          Copy-Item "$($binDir.FullName)\ffprobe.exe" "packaging\tools\ffprobe.exe"
          $nvenc = & "packaging\tools\ffmpeg.exe" -hide_banner -encoders 2>$null | Select-String hevc_nvenc
          if (-not $nvenc) { Write-Error "ffmpeg bundle lacks hevc_nvenc"; exit 1 }
          Write-Host "ffmpeg bundle OK: hevc_nvenc present"

      - name: Download Subtitle Edit (portable, bundled into the app)
        shell: pwsh
        run: |
          $seUrl = "https://github.com/SubtitleEdit/subtitleedit/releases/download/v5.2.0/SubtitleEdit-Windows-x64.zip"
          $seZip = "$env:TEMP\se.zip"
          Invoke-WebRequest -Uri $seUrl -OutFile $seZip -TimeoutSec 300
          Expand-Archive -Path $seZip -DestinationPath "$env:TEMP\se-extract" -Force
          New-Item -ItemType Directory -Force -Path "packaging\tools\SubtitleEdit" | Out-Null
          Copy-Item "$env:TEMP\se-extract\*" "packaging\tools\SubtitleEdit\" -Recurse -Force
          if (-not (Test-Path "packaging\tools\SubtitleEdit\SubtitleEdit.exe")) {
            Write-Error "SubtitleEdit.exe missing after extract"; exit 1
          }

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e . PySide6 pyinstaller pytest

      - name: Tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build exe
        run: pyinstaller bluray_to_mp4.spec --noconfirm

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist\bluray-to-mp4 -DestinationPath bluray-to-mp4-windows-x64.zip

      - name: Smoke-test the exe
        shell: pwsh
        run: |
          $exe = "dist\bluray-to-mp4\bluray-to-mp4.exe"
          if (-not (Test-Path $exe)) { throw "exe missing" }
          $proc = Start-Process -FilePath $exe -ArgumentList "--status" -NoNewWindow -PassThru -RedirectStandardOutput "smoke-out.txt" -RedirectStandardError "smoke-err.txt"
          # --status prints a monitor snapshot and exits immediately.
          if (-not $proc.WaitForExit(30000)) { $proc.Kill(); throw "exe did not exit" }
          if ($proc.ExitCode -ne 0) { throw "exe exited with $($proc.ExitCode)" }
          Get-Content smoke-out.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: bluray-to-mp4-windows-x64.zip
          retention-days: 30