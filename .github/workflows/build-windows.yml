name: build-windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download ffmpeg (n8.1, NVENC SDK 13.0 matches driver 590+)
        shell: pwsh
        run: |
          $zipUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-8.1.zip"
          $zipPath = "$env:TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath -TimeoutSec 600
          Expand-Archive -Path $zipPath -DestinationPath "$env:TEMP\ffmpeg-extract" -Force
          $binDir = Get-ChildItem "$env:TEMP\ffmpeg-extract" -Recurse -Directory | Where-Object { $_.Name -eq "bin" } | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "packaging\tools" | Out-Null
          Copy-Item "$($binDir.FullName)\ffmpeg.exe" "packaging\tools\ffmpeg.exe"
          Copy-Item "$($binDir.FullName)\ffprobe.exe" "packaging\tools\ffprobe.exe"
          $nvenc = & "packaging\tools\ffmpeg.exe" -hide_banner -encoders 2>$null | Select-String hevc_nvenc
          if (-not $nvenc) { Write-Error "ffmpeg bundle lacks hevc_nvenc"; exit 1 }
          Write-Host "ffmpeg bundle OK: hevc_nvenc present"

      - name: Download Subtitle Edit seconv + Tesseract (headless unattended OCR)
        shell: pwsh
        run: |
          # v0.2.27: seconv is SE's own headless CLI converter (same 5.2.0
          # core as the GUI). The GUI zip bundled before v0.2.7 has no
          # unattended mode at all - its 5.x rewrite dropped /convert, so
          # every "headless" OCR call actually opened the interactive OCR
          # wizard and waited for a human (Eric's 2026-10-02 zero-touch
          # criterion, still unmet on the morning of 2026-10-04).
          $seUrl = "https://github.com/SubtitleEdit/subtitleedit/releases/download/v5.2.0/SeConv-Windows-x64.zip"
          $seZip = "$env:TEMP\seconv.zip"
          Invoke-WebRequest -Uri $seUrl -OutFile $seZip -TimeoutSec 600
          Expand-Archive -Path $seZip -DestinationPath "$env:TEMP\seconv-extract" -Force
          New-Item -ItemType Directory -Force -Path "packaging\tools\SubtitleEdit" | Out-Null
          Copy-Item "$env:TEMP\seconv-extract\*" "packaging\tools\SubtitleEdit\" -Recurse -Force
          if (-not (Test-Path "packaging\tools\SubtitleEdit\seconv.exe")) {
            Write-Error "seconv.exe missing after extract"; exit 1
          }
          # Tesseract: SE's own Windows build (5.5.3) plus the English model
          # from the tessdata repo SE itself downloads from, so a fresh
          # extraction runs unattended OCR with zero extra installs.
          $tUrl = "https://github.com/SubtitleEdit/support-files/releases/download/tesseract553/Tesseract553.zip"
          $tZip = "$env:TEMP\tesseract.zip"
          Invoke-WebRequest -Uri $tUrl -OutFile $tZip -TimeoutSec 600
          Expand-Archive -Path $tZip -DestinationPath "$env:TEMP\tesseract-extract" -Force
          New-Item -ItemType Directory -Force -Path "packaging\tools\SubtitleEdit\Tesseract" | Out-Null
          Copy-Item "$env:TEMP\tesseract-extract\*" "packaging\tools\SubtitleEdit\Tesseract\" -Recurse -Force
          if (-not (Test-Path "packaging\tools\SubtitleEdit\Tesseract\tesseract.exe")) {
            Write-Error "tesseract.exe missing after extract"; exit 1
          }
          New-Item -ItemType Directory -Force -Path "packaging\tools\SubtitleEdit\Tesseract\tessdata" | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/tesseract-ocr/tessdata/master/eng.traineddata" -OutFile "packaging\tools\SubtitleEdit\Tesseract\tessdata\eng.traineddata" -TimeoutSec 600
          if (-not (Test-Path "packaging\tools\SubtitleEdit\Tesseract\tessdata\eng.traineddata")) {
            Write-Error "eng.traineddata missing after download"; exit 1
          }
          Write-Host "seconv + Tesseract staged for unattended OCR"

      - name: Download Real-ESRGAN ncnn/Vulkan (bundled DVD AI upscale)
        shell: pwsh
        run: |
          $rgUrl = "https://github.com/xinntao/Real-ESRGAN-ncnn-vulkan/releases/download/v0.2.0/realesrgan-ncnn-vulkan-v0.2.0-windows.zip"
          $rgZip = "$env:TEMP\realesrgan.zip"
          Invoke-WebRequest -Uri $rgUrl -OutFile $rgZip -TimeoutSec 600
          Expand-Archive -Path $rgZip -DestinationPath "$env:TEMP\realesrgan-extract" -Force
          $rgDir = Get-ChildItem "$env:TEMP\realesrgan-extract" -Recurse -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName "realesrgan-ncnn-vulkan.exe") } |
            Select-Object -First 1
          if (-not $rgDir) { Write-Error "Real-ESRGAN executable missing after extract"; exit 1 }
          Copy-Item "$($rgDir.FullName)\*" "packaging\tools\" -Recurse -Force
          if (-not (Test-Path "packaging\tools\realesrgan-ncnn-vulkan.exe")) {
            Write-Error "Real-ESRGAN executable was not staged"; exit 1
          }
          $modelsTarget = "$env:TEMP\realesrgan-model-wheel"
          python -m pip install --target $modelsTarget realesrgan-ncnn-py==2.0.0
          $modelsDir = Get-ChildItem $modelsTarget -Recurse -Directory |
            Where-Object { $_.FullName -like "*realesrgan_ncnn_py*\models" } |
            Select-Object -First 1
          if (-not $modelsDir) { Write-Error "Real-ESRGAN model wheel did not contain models"; exit 1 }
          New-Item -ItemType Directory -Force -Path "packaging\tools\models" | Out-Null
          Copy-Item "$($modelsDir.FullName)\*" "packaging\tools\models\" -Recurse -Force
          foreach ($model in @(
            "models\realesrgan-x4plus.param",
            "models\realesrgan-x4plus.bin",
            "models\realesr-animevideov3-x2.param",
            "models\realesr-animevideov3-x2.bin"
          )) {
            if (-not (Test-Path "packaging\tools\$model")) {
              Write-Error "Real-ESRGAN model missing: $model"; exit 1
            }
          }
          Write-Host "Real-ESRGAN bundle staged with models"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e . PySide6 pyinstaller pytest

      - name: Tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Stamp version into exe metadata
        shell: pwsh
        run: |
          $ver = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          Write-Host "Stamping publisher metadata for v$ver"
          $vf = "packaging/version_info.txt"
          $c = Get-Content $vf -Raw
          $parts = $ver.Split('.')
          $c = $c -replace "filevers=\(\d+, \d+, \d+, \d+\)", "filevers=($($parts[0]), $($parts[1]), $($parts[2]), 0)"
          $c = $c -replace "prodvers=\(\d+, \d+, \d+, \d+\)", "prodvers=($($parts[0]), $($parts[1]), $($parts[2]), 0)"
          $c = $c -replace "StringStruct\('FileVersion', '[\d.]+'\)", "StringStruct('FileVersion', '$ver')"
          $c = $c -replace "StringStruct\('ProductVersion', '[\d.]+'\)", "StringStruct('ProductVersion', '$ver')"
          Set-Content $vf $c -NoNewline

      - name: Build exe
        run: pyinstaller bluray_to_mp4.spec --noconfirm

      - name: Verify bundled payloads (Real-ESRGAN + headless OCR)
        shell: pwsh
        run: |
          $tools = "dist\bluray-to-mp4\_internal\tools"
          if (-not (Test-Path $tools)) { $tools = "dist\bluray-to-mp4\tools" }
          if (-not (Test-Path "$tools\realesrgan-ncnn-vulkan.exe")) {
            Write-Error "Real-ESRGAN executable missing from PyInstaller output"; exit 1
          }
          foreach ($model in @(
            "models\realesrgan-x4plus.param",
            "models\realesrgan-x4plus.bin",
            "models\realesr-animevideov3-x2.param",
            "models\realesr-animevideov3-x2.bin"
          )) {
            if (-not (Test-Path "$tools\$model")) {
              Write-Error "Real-ESRGAN model missing from PyInstaller output: $model"; exit 1
            }
          }
          # v0.2.27: the unattended OCR stack must be in the zip too -
          # without seconv the OCR stage can only open the GUI wizard.
          if (-not (Test-Path "$tools\SubtitleEdit\seconv.exe")) {
            Write-Error "seconv.exe missing from PyInstaller output"; exit 1
          }
          if (-not (Test-Path "$tools\SubtitleEdit\Tesseract\tesseract.exe")) {
            Write-Error "bundled tesseract.exe missing from PyInstaller output"; exit 1
          }
          if (-not (Test-Path "$tools\SubtitleEdit\Tesseract\tessdata\eng.traineddata")) {
            Write-Error "bundled eng.traineddata missing from PyInstaller output"; exit 1
          }
          Write-Host "Bundled payloads verified in $tools"

      - name: Sign the exe (YetiWurks LLC)
        shell: pwsh
        env:
          YW_CODESIGN_PFX_B64: ${{ secrets.YW_CODESIGN_PFX_B64 }}
          YW_CODESIGN_PW: ${{ secrets.YW_CODESIGN_PW }}
        run: |
          $env:YW_CODESIGN_PW = $env:YW_CODESIGN_PW.Trim()
          [IO.File]::WriteAllBytes("$env:TEMP\cs.pfx", [Convert]::FromBase64String($env:YW_CODESIGN_PFX_B64))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1).FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          $exe = "dist\bluray-to-mp4\bluray-to-mp4.exe"
          & $signtool sign /f "$env:TEMP\cs.pfx" /p $env:YW_CODESIGN_PW /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed" }
          # Trust the YetiWurks Root CA (chain anchor) + signing leaf on this
          # runner so full-chain validation passes. LocalMachine stores:
          # admin-only, NO interactive confirmation prompt (CurrentUser\Root
          # pops a GUI dialog and hangs headless CI).
          $rootCa = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2("packaging\YetiWurks-Root-CA.cer")
          $rootStore = New-Object System.Security.Cryptography.X509Certificates.X509Store("Root", "LocalMachine")
          $rootStore.Open("ReadWrite"); $rootStore.Add($rootCa); $rootStore.Close()
          $leaf = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2("$env:TEMP\cs.pfx", $env:YW_CODESIGN_PW)
          $tpStore = New-Object System.Security.Cryptography.X509Certificates.X509Store("TrustedPeople", "LocalMachine")
          $tpStore.Open("ReadWrite"); $tpStore.Add($leaf); $tpStore.Close()
          $si = Get-AuthenticodeSignature $exe
          Write-Host "Signer: $($si.SignerCertificate.Subject)"
          if ($si.Status -ne "Valid") { throw "signature invalid on runner: $($si.Status) $($si.StatusMessage)" }
          Write-Host "Signed as YetiWurks LLC - signature verified"

      - name: Ship trust files (publisher cert + one-time install script)
        shell: pwsh
        run: |
          Copy-Item packaging\YetiWurks-Root-CA.cer dist\bluray-to-mp4\
          Copy-Item packaging\YetiWurks-CodeSigning.cer dist\bluray-to-mp4\
          Copy-Item packaging\install-cert.ps1 dist\bluray-to-mp4\
          Write-Host "Trust files shipped in the app folder"

      - name: Package with version-stamped name
        shell: pwsh
        run: |
          # Eric request 2026-10-02 - the zip filename must carry the
          # build number so fresh extractions are identifiable on disk.
          $ver = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          Set-Content -Path version.txt -Value $ver
          Copy-Item version.txt dist\bluray-to-mp4\version.txt
          Compress-Archive -Path dist\bluray-to-mp4 -DestinationPath "bluray-to-mp4-$ver-windows-x64.zip"
          Write-Host "Packaged bluray-to-mp4-$ver-windows-x64.zip"


      - name: Smoke-test the exe
        shell: pwsh
        run: |
          $exe = "dist\bluray-to-mp4\bluray-to-mp4.exe"
          if (-not (Test-Path $exe)) { throw "exe missing" }
          $proc = Start-Process -FilePath $exe -ArgumentList "--status" -NoNewWindow -PassThru -RedirectStandardOutput "smoke-out.txt" -RedirectStandardError "smoke-err.txt"
          # --status prints a monitor snapshot and exits immediately.
          if (-not $proc.WaitForExit(30000)) { $proc.Kill(); throw "exe did not exit" }
          if ($proc.ExitCode -ne 0) { throw "exe exited with $($proc.ExitCode)" }
          Get-Content smoke-out.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            bluray-to-mp4-*-windows-x64.zip
            version.txt
          retention-days: 30